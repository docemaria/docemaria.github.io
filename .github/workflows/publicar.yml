# Publica o site no GitHub Pages a cada push na main.
# Antes, roda os testes das regras e a checagem do catálogo em modo "publicar":
# se um preço estiver errado, faltar foto ou houver foto sem licença, nada é publicado.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Testes das regras (preços, datas, taxa de entrega, mensagem do WhatsApp)
        run: npm test

      - name: Checagem do catálogo para publicar (preços, fotos, licenças)
        run: npm run validar:publicar

      - name: Versão nos endereços (o celular não fica com arquivo velho no cache)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__VERSAO__/$V/g" site/index.html site/js/*.js
          ! grep -rn "__VERSAO__" site/index.html site/js/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
